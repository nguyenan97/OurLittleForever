name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - name: Use the validated npm version for cross-platform optional dependencies
        run: npm install --global npm@11.21.3
      - run: npm ci
      - run: npm run media
      - name: Restore optimized media without committing image files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view website-media --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download website-media --repo "$GITHUB_REPOSITORY" --pattern media.tar.gz --dir "$RUNNER_TEMP"
            tar -xzf "$RUNNER_TEMP/media.tar.gz" -C public
          fi
      - run: npm run compile:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/our-little-forever/browser
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
